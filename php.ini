; CommandCode — php.ini overrides for shared hosting
; Upload this to your hosting root if PHP limits are too low

; Upload limits (for KYC document uploads)
upload_max_filesize = 50M
post_max_size = 50M

; Execution limits (for installer migrations)
max_execution_time = 300
max_input_time = 120
memory_limit = 256M

; Error reporting (keep off in production)
display_errors = Off
log_errors = On
error_log = storage/logs/php-errors.log

; Session settings
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.use_strict_mode = 1

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; OPcache (if available)
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 2000
opcache.revalidate_freq = 60
